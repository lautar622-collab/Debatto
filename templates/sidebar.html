<div class="sidebar">
    <h1>Debatto</h1>
    <p><i>Where minds clash free</i></p>
    <div class="account" id="account">
{% if session.get("username") %}
<b><a class="clickpost" href="{{ url_for('profile', username=session['username']) }}">{{ session["username"] }}</a></b> | <a href="{{ url_for('logout') }}">Log Out</a>
{% else %}
<div id="account-buttons">
    <button type="button" onclick="showLogin()">Log In</button>
    <button type="button" onclick="showSignup()">Sign Up</button>
</div>
<form action="{{ url_for('login') }}" method="post" id="login-form" style="display:none;">
    <input type="text" placeholder="Username" name="username">
    <input type="password" placeholder="Password" name="password">
    <button type="submit">Go</button>
    <button type="button" onclick="showButtons()">Back</button>
</form>
<form action="{{ url_for('signup') }}" method="post" id="signup-form" style="display:none;">
    <input type="text" placeholder="Username" name="username" required>
    <input type="password" placeholder="Password" name="password" required>
    <input type="email" placeholder="E-mail (Optional)" name="email">
    <button type="submit">Go</button>
    <button type="button" onclick="showButtons()">Back</button>
</form>
{% endif %}
</div>
<script>
function showLogin() {
    document.getElementById("account-buttons").style.display = "none";
    document.getElementById("signup-form").style.display = "none";
    document.getElementById("login-form").style.display = "block";
}
function showSignup() {
    document.getElementById("account-buttons").style.display = "none";
    document.getElementById("login-form").style.display = "none";
    document.getElementById("signup-form").style.display = "block";
}
function showButtons() {
    document.getElementById("login-form").style.display = "none";
    document.getElementById("signup-form").style.display = "none";
    document.getElementById("account-buttons").style.display = "block";
}
</script>
