<div class="sidebar">
    <div class="lang-selector">
        <button class="lang-btn" data-lang="en" onclick="applyLanguage('en')">🇬🇧 EN</button>
        <button class="lang-btn" data-lang="es" onclick="applyLanguage('es')">🇪🇸 ES</button>
    </div>
    <h1>Debatto</h1>
    <p><i data-i18n="tagline">Where minds clash free</i></p>
    <div class="account" id="account">
{% if session.get("username") %}
<b><a class="clickpost" href="{{ url_for('profile', username=session['username']) }}">{{ session["username"] }}</a></b> | <a href="{{ url_for('logout') }}" data-i18n="btn_logout">Log Out</a>
{% else %}
<div id="account-buttons">
    <button type="button" onclick="showLogin()" data-i18n="btn_login">Log In</button>
    <button type="button" onclick="showSignup()" data-i18n="btn_signup">Sign Up</button>
</div>
<form action="{{ url_for('login') }}" method="post" id="login-form" style="display:none;">
    <input type="text" placeholder="Username" data-i18n-placeholder="username_placeholder" name="username">
    <input type="password" placeholder="Password" data-i18n-placeholder="password_placeholder" name="password">
    <button type="submit" data-i18n="btn_go">Go</button>
    <button type="button" onclick="showButtons()" data-i18n="btn_back">Back</button>
</form>
<form action="{{ url_for('signup') }}" method="post" id="signup-form" style="display:none;">
    <input type="text" placeholder="Username" data-i18n-placeholder="username_placeholder" name="username" required>
    <input type="password" placeholder="Password" data-i18n-placeholder="password_placeholder" name="password" required>
    <input type="email" placeholder="E-mail (Optional)" data-i18n-placeholder="email_placeholder" name="email">
    <button type="submit" data-i18n="btn_go">Go</button>
    <button type="button" onclick="showButtons()" data-i18n="btn_back">Back</button>
</form>
{% endif %}
</div>
<script>
function showLogin() {
    document.getElementById("account-buttons").style.display = "none";
    document.getElementById("signup-form").style.display = "none";
    document.getElementById("login-form").style.display = "block";
}
function showSignup() {
    document.getElementById("account-buttons").style.display = "none";
    document.getElementById("login-form").style.display = "none";
    document.getElementById("signup-form").style.display = "block";
}
function showButtons() {
    document.getElementById("login-form").style.display = "none";
    document.getElementById("signup-form").style.display = "none";
    document.getElementById("account-buttons").style.display = "block";
}
</script>

        <a href="{{ url_for('index') }}" data-i18n="nav_home">Home</a><br><br>
        <a href="{{ url_for('newpost') }}" data-i18n="nav_post">Post</a><br><br>
{% if session.get("username") %}
    <a href="{{ url_for('profile', username=session['username']) }}" data-i18n="nav_account">Account</a><br>
{% endif %}
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    </div>
