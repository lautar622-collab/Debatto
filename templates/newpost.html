<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png"href="static/favicon.png">
    <title>Debatto - Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "sidebar.html" %}
    <div class="content">
        <h1>New Post</h1>
        <form action="/newpost" class="formpost" method="post">
            <input type="text" placeholder="Title" name="title" class="ptitle">
                <select aria-placeholder="Seriousness Level" name="level">
                <option value="" disabled selected>Seriousness</option>
                <option value="1">1- Joke</option>
                <option value="2">2- Casual</option>
                <option value="3">3- Logic</option>
                <option value="4">4- Academic</option>
                <option value="5">5- Brilliant</option>
            </select>
            <br>
            <br>
            <textarea placeholder="Content (up to 5000 characters)" 
            class="pcontent" maxlength="5000" name="content"></textarea> <p>Add topics</p>
            <input type="text" name="topic1" required>
            <input type="text" name="topic2">
            <input type="text" name="topic3">
            <br><br>
            <button type="submit">Post</button>
        </form>
    </div>

</body>
</html>
