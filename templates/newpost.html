<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <title>Debatto - Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "sidebar.html" %}

    <div class="content">
        <h1 data-i18n="newpost_title">New Post</h1>

        <form action="/newpost" class="formpost" method="post" enctype="multipart/form-data">

            <div class="post-composer">

                <div class="composer-main">
                    <input
                        type="text"
                        placeholder="Title (up to 200 characters)"
                        data-i18n-placeholder="title_placeholder"
                        name="title"
                        class="ptitle"
                        maxlength="200"
                        required
                    >

                    <div class="composer-selectors">
                        <select name="level" required>
                            <option value="" disabled selected data-i18n="seriousness_select">Seriousness</option>
                            <option value="1">1- Joke</option>
                            <option value="2">2- Casual</option>
                            <option value="3">3- Logic</option>
                            <option value="4">4- Academic</option>
                            <option value="5">5- Brilliant</option>
                        </select>

                        <select name="language" aria-label="Language">
                            <option value="gb">English</option>
                            <option value="es">Español</option>
                            <option value="pt">Português</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="ru">русский</option>
                            <option value="ch">中文</option>
                            <option value="jp">日本語</option>
                        </select>
                    </div>

                    <textarea
                        placeholder="Content"
                        data-i18n-placeholder="content_placeholder"
                        class="pcontent"
                        maxlength="5000"
                        name="content"
                    ></textarea>

                    <p data-i18n="add_topics">Add topics</p>
                    <input type="text" name="topic1" required>
                    <input type="text" name="topic2">
                    <input type="text" name="topic3">

                    <p>
                        <span data-i18n="attach_images">Attach images</span>
                        <small data-i18n="attach_images_hint">(optional · PNG, JPG, GIF, WEBP · max 5 MB each)</small>
                    </p>

                    <label class="upload-btn" for="image-input">
                        <span data-i18n="choose_images_btn">📎 Choose images</span>
                        <input
                            id="image-input"
                            type="file"
                            name="images"
                            accept="image/png,image/jpeg,image/gif,image/webp"
                            multiple
                            style="display:none"
                        >
                    </label>

                    <div id="image-preview" class="image-preview-grid"></div>
                        <div class="composer-submit">
                            <button type="submit" data-i18n="btn_post">Post</button>
                        </div>
                    </div>



            </div>
        </form>

        <script>
            document.getElementById('image-input').addEventListener('change', function () {
                const preview = document.getElementById('image-preview');
                preview.innerHTML = '';

                Array.from(this.files).forEach(function(file) {
                    const reader = new FileReader();

                    reader.onload = function(e) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'preview-thumb';

                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = file.name;

                        const label = document.createElement('span');
                        label.textContent = file.name;

                        wrapper.appendChild(img);
                        wrapper.appendChild(label);
                        preview.appendChild(wrapper);
                    };

                    reader.readAsDataURL(file);
                });
            });
        </script>
    </div>
</body>
</html>
