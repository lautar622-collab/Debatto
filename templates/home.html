<!DOCTYPE html>
<html>
<head>
    <title>Debatto</title>
    <link rel="icon" type="image/png"href="static/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "sidebar.html" %}
    <div class="content">
        <h1>Home</h1>
        {% for post in posts %}
            <a class="clickpost" href="{{ url_for('post', post_id=post.id) }}">
                <div class="postdiv">
    <h2><a class="clickpost" href="{{ url_for('post', post_id=post.id) }}">{{ post.title }} </a></h2>
    -<i><a href="{{ url_for('profile', username=post.author) }}">{{ post.username }}</a></i>
    <p class="post-data">
        Seriousness: <b>{{post.level}}</b>
        ID: {{post.id}} - {{post.date}}
        <br>
        <b>
        {% for topic in post.topics|default([]) %}
            {{ topic }}
        {% endfor %}
        </b>
    </p>
    <p class="post-content"><a class="clickpost" href="{{ url_for('post', post_id=post.id) }}">{{ post.content }}</a></p>
</div>
<hr>
        {% endfor %}
        <br>
    </div>
</body>
</html>
